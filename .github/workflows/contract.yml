name: Global statistics contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: etzhayyim/jp.go.meti.enecho
          ref: cc2d7e4f5400a1d6c06b6d8fa60345e37d8473b2
          path: .sources/jp.go.meti.enecho
      - uses: actions/checkout@v4
        with:
          repository: etzhayyim/org.worldbank.api
          ref: 0869056d9baa7858c1da25e4e22324b7147cab05
          path: .sources/org.worldbank.api
      - uses: actions/checkout@v4
        with:
          repository: etzhayyim/org.ourworldindata
          ref: c63c1aeaf654f125191b3ba25c01c4b78851dcef
          path: .sources/org.ourworldindata
      - uses: actions/checkout@v4
        with:
          repository: etzhayyim/org.un.unstats
          ref: d55600e0884c32277fc19be205296c5764355e5c
          path: .sources/org.un.unstats
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install NBB query runtime
        run: npm install --no-save --ignore-scripts nbb@1.3.204
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Verify source hashes and git-annex pointers
        run: npx nbb bin/verify-source-catalogs.cljs .sources
      - name: Verify CI source lock
        run: npx nbb bin/verify-ci-lock.cljs
      - name: Rebuild committed projections
        run: npx nbb bin/build.cljs .sources
      - name: Reject stale generated datoms
        run: git diff --exit-code -- data
      - name: Exercise Datascript query contract
        run: clojure -M test/query_contract.clj
