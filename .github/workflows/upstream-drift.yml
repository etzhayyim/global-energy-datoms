name: Upstream drift report

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: etzhayyim/jp.go.meti.enecho
          ref: cc2d7e4f5400a1d6c06b6d8fa60345e37d8473b2
          path: .sources/jp.go.meti.enecho
      - uses: actions/checkout@v4
        with:
          repository: etzhayyim/org.ourworldindata
          ref: c63c1aeaf654f125191b3ba25c01c4b78851dcef
          path: .sources/org.ourworldindata
      - uses: actions/checkout@v4
        with:
          repository: etzhayyim/org.un.unstats
          ref: 0bfe52c5e3296953d532327e163183cab7485f5e
          path: .sources/org.un.unstats
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install NBB report runtime
        run: npm install --no-save --ignore-scripts nbb@1.3.204
      - name: Report upstream byte drift
        run: npx nbb bin/report-upstream-drift.cljs .sources
